spring.config.import=optional:file:./secrets/application-secrets.properties

spring.application.name=pulse

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info

spring.security.user.name=${APP_ADMIN_USERNAME}
spring.security.user.password=${APP_ADMIN_PASSWORD}

pulse.github.base-url=${GITHUB_BASE_URL}
pulse.github.token=${GITHUB_TOKEN}
pulse.github.connect-timeout-ms=3000
pulse.github.read-timeout-ms=5000
pulse.github.page-size=100


spring.ai.ollama.base-url=${OLLAMA_BASE_URL}

spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:not-set}
spring.ai.openai.api-key=${OPENAI_API_KEY:not-set}

spring.ai.chat.client.enabled=false

app.ai.enabled=true
app.ai.features.nlsearch.enabled=true

# routes: tried in order; first healthy one wins
app.ai.features.nlsearch.routes[0].provider=ollama
app.ai.features.nlsearch.routes[0].model=llama3.2
app.ai.features.nlsearch.routes[0].timeout=80s
app.ai.features.nlsearch.routes[0].temperature=0.0
app.ai.features.nlsearch.routes[0].enabled=true

app.ai.features.nlsearch.routes[1].provider=openai
app.ai.features.nlsearch.routes[1].model=gpt-4o-mini
app.ai.features.nlsearch.routes[1].timeout=3s
app.ai.features.nlsearch.routes[1].temperature=0.0
app.ai.features.nlsearch.routes[1].enabled=false

# parked backup, flip to true when needed
app.ai.features.nlsearch.routes[2].provider=anthropic
app.ai.features.nlsearch.routes[2].model=claude-sonnet-5-5
app.ai.features.nlsearch.routes[2].timeout=5s
app.ai.features.nlsearch.routes[2].enabled=false

resilience4j.circuitbreaker.configs.default.slidingWindowSize=10
resilience4j.circuitbreaker.configs.default.minimumNumberOfCalls=5
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=30s

