spring.application.name=pulse

spring.datasource.url=jdbc:postgresql://localhost:5432/pulse
spring.datasource.username=pulse
spring.datasource.password=pulse

# schema comes from Flyway, never from Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info

spring.security.user.name=admin
spring.security.user.password=admin

pulse.github.base-url=https://api.github.com
pulse.github.token=
pulse.github.connect-timeout-ms=3000
pulse.github.read-timeout-ms=5000
pulse.github.page-size=100
